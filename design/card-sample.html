<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ネコカード見本</title>
<style>
  :root {
    --bg: #fff8ee;
    --text: #2b2b3a;
    --sub: #7a7a8c;
    --line: #f0e3d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  }

  /* カードの外わく：レア度で色が変わる（SR は金） */
  .card {
    position: relative;
    width: 300px;
    padding: 6px;
    border-radius: 22px;
    background: linear-gradient(135deg, #fff1a8, #f0b400 30%, #fff6c9 50%, #e09a00 70%, #ffe27a);
    box-shadow: 0 8px 24px rgba(160, 110, 0, 0.35);
    overflow: hidden;
  }
  .card-inner {
    border-radius: 17px;
    background: #fff;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
  }
  .rarity {
    padding: 2px 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f0b400, #ffcf3f);
    color: #5a3b00;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  .no { color: var(--sub); font-size: 13px; font-weight: bold; }
  .type { color: #6c5ce7; font-size: 12px; font-weight: bold; }
  .art { display: block; width: 100%; height: auto; }
  .name {
    margin: 10px 12px 2px;
    font-size: 21px;
    font-weight: bold;
    text-align: center;
  }
  .profile {
    margin: 8px 12px 0;
    padding: 0;
    list-style: none;
    font-size: 14px;
    line-height: 1.55;
  }
  .profile li { display: flex; gap: 6px; padding: 3px 0; border-top: 1px dashed var(--line); }
  .profile li:first-child { border-top: none; }
  .profile b { flex-shrink: 0; color: var(--sub); font-weight: bold; }
  .quote {
    position: relative;
    margin: 10px 12px 14px;
    padding: 8px 12px;
    border-radius: 12px;
    background: #f4f1ff;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }

  /* SR だけ、表面を光がすーっと流れる */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.55) 48%, transparent 60%);
    transform: translateX(-100%);
    animation: shine 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 55% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card::after { animation: none; display: none; }
  }
  .caption { margin-top: 16px; color: var(--sub); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div>
  <div class="card">
    <div class="card-inner">
      <div class="card-head">
        <span class="rarity">SR</span>
        <span class="type">かっこいい系</span>
        <span class="no">No.01</span>
      </div>

      <svg class="art" viewBox="0 0 240 240" role="img" aria-label="王冠とマントを身につけた白いネコが、星空の中でねむそうにすわっている絵">
        <defs>
          <radialGradient id="space" cx="50%" cy="45%" r="70%">
            <stop offset="0" stop-color="#3b3f8f"/>
            <stop offset="1" stop-color="#14143a"/>
          </radialGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe680"/>
            <stop offset="1" stop-color="#f0a500"/>
          </linearGradient>
          <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e0444f"/>
            <stop offset="1" stop-color="#a5202d"/>
          </linearGradient>
        </defs>

        <!-- 星空 -->
        <rect width="240" height="240" fill="url(#space)"/>
        <g fill="#fff">
          <circle cx="22" cy="100" r="1.4"/><circle cx="200" cy="30" r="1.8"/><circle cx="215" cy="95" r="1.2"/>
          <circle cx="30" cy="170" r="1.6"/><circle cx="208" cy="160" r="1.4"/><circle cx="80" cy="22" r="1.2"/>
          <circle cx="160" cy="18" r="1.3"/><circle cx="12" cy="214" r="1.2"/><circle cx="228" cy="220" r="1.5"/>
        </g>
        <g fill="#ffe680">
          <path d="M28 84 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
          <path d="M36 140 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
        </g>
        <!-- 土星 -->
        <circle cx="44" cy="50" r="15" fill="#f4a259"/>
        <ellipse cx="44" cy="50" rx="27" ry="7" fill="none" stroke="#ffd58a" stroke-width="3" transform="rotate(-20 44 50)"/>
        <!-- 流れ星 -->
        <path d="M150 44 L196 22" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <circle cx="198" cy="21" r="3" fill="#fff"/>

        <!-- マント（からだの後ろ） -->
        <path d="M76 150 Q120 140 164 150 L192 228 Q120 240 48 228 Z" fill="url(#cape)" stroke="#ffcf4a" stroke-width="3" stroke-linejoin="round"/>

        <!-- しっぽ -->
        <path d="M152 206 C196 210 208 170 186 150" fill="none" stroke="#3a3a4a" stroke-width="17" stroke-linecap="round"/>
        <path d="M152 206 C196 210 208 170 186 150" fill="none" stroke="#fffaf2" stroke-width="11" stroke-linecap="round"/>

        <!-- からだ -->
        <ellipse cx="120" cy="186" rx="40" ry="36" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3"/>
        <!-- 前足 -->
        <ellipse cx="104" cy="218" rx="13" ry="8" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3"/>
        <ellipse cx="136" cy="218" rx="13" ry="8" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3"/>

        <!-- 白い毛皮のえり（王さまっぽく） -->
        <ellipse cx="120" cy="154" rx="38" ry="11" fill="#fff" stroke="#3a3a4a" stroke-width="2.5"/>
        <g fill="#3a3a4a">
          <circle cx="96" cy="155" r="1.8"/><circle cx="110" cy="158" r="1.8"/><circle cx="130" cy="158" r="1.8"/><circle cx="144" cy="155" r="1.8"/>
        </g>

        <!-- 耳 -->
        <path d="M78 98 L84 56 L112 82 Z" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M86 88 L88 68 L102 82 Z" fill="#ffb3c1"/>
        <path d="M162 98 L156 56 L128 82 Z" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M154 88 L152 68 L138 82 Z" fill="#ffb3c1"/>

        <!-- 頭 -->
        <ellipse cx="120" cy="118" rx="52" ry="42" fill="#fffaf2" stroke="#3a3a4a" stroke-width="3"/>

        <!-- ねむそうな目 -->
        <path d="M93 116 Q104 122 115 116" fill="none" stroke="#3a3a4a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M125 116 Q136 122 147 116" fill="none" stroke="#3a3a4a" stroke-width="3.5" stroke-linecap="round"/>
        <!-- ほっぺ -->
        <ellipse cx="91" cy="131" rx="8" ry="5" fill="#ffb3c1" opacity="0.75"/>
        <ellipse cx="149" cy="131" rx="8" ry="5" fill="#ffb3c1" opacity="0.75"/>
        <!-- 鼻と口 -->
        <path d="M115.5 127 L124.5 127 L120 132 Z" fill="#f28b9b" stroke="#3a3a4a" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M120 132 Q117 138 111 135 M120 132 Q123 138 129 135" fill="none" stroke="#3a3a4a" stroke-width="2.2" stroke-linecap="round"/>
        <!-- ひげ -->
        <g stroke="#3a3a4a" stroke-width="2" stroke-linecap="round">
          <path d="M86 127 L62 121"/><path d="M86 133 L61 135"/>
          <path d="M154 127 L178 121"/><path d="M154 133 L179 135"/>
        </g>

        <!-- 王冠 -->
        <path d="M94 80 L98 54 L109 67 L120 46 L131 67 L142 54 L146 80 Z" fill="url(#gold)" stroke="#a86f00" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="93" y="76" width="54" height="8" rx="3" fill="url(#gold)" stroke="#a86f00" stroke-width="2.5"/>
        <circle cx="98" cy="54" r="3.5" fill="#4fc3f7" stroke="#a86f00" stroke-width="1.5"/>
        <circle cx="120" cy="46" r="4.5" fill="#ef4f6a" stroke="#a86f00" stroke-width="1.5"/>
        <circle cx="142" cy="54" r="3.5" fill="#4fc3f7" stroke="#a86f00" stroke-width="1.5"/>

        <!-- ねむい -->
        <text x="170" y="96" fill="#cfd3ff" font-size="18" font-weight="bold" font-family="sans-serif">z</text>
        <text x="182" y="82" fill="#cfd3ff" font-size="13" font-weight="bold" font-family="sans-serif">z</text>
      </svg>

      <p class="name">宇宙を旅するネコ王</p>
      <ul class="profile">
        <li><b>好物</b><span>流れ星のかけら（たぶん金平糖）</span></li>
        <li><b>特技</b><span>ワープ（行き先はいつもこたつ）</span></li>
      </ul>
      <p class="quote">「余は眠い」</p>
    </div>
  </div>
  <p class="caption">ネコカード見本（No.01・SR）</p>
</div>
</body>
</html>
